<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 14px 16px; width: 260px; color: #1c1e21; }
    h1 { font-size: 15px; margin: 0 0 10px; }
    label { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; cursor: pointer; }
    label span.count { color: #65676b; font-size: 12px; margin-left: auto; margin-right: 10px; }
    hr { border: 0; border-top: 1px solid #e4e6eb; margin: 8px 0; }
    .hint { color: #65676b; font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>FB Cleaner</h1>
  <label>Ads &amp; sponsored <span class="count" id="c-ad"></span><input type="checkbox" id="ads"></label>
  <label>AI-labelled content <span class="count" id="c-ai"></span><input type="checkbox" id="ai"></label>
  <label>Follow suggestions <span class="count" id="c-follow"></span><input type="checkbox" id="follow"></label>
  <label>Join suggestions <span class="count" id="c-join"></span><input type="checkbox" id="join"></label>
  <label>Suggested / Reels <span class="count" id="c-suggested"></span><input type="checkbox" id="suggested"></label>
  <hr>
  <label>Preview mode (outline instead of hide) <input type="checkbox" id="debug"></label>
  <div class="hint" id="hint"></div>
  <script src="popup.js"></script>
</body>
</html>
